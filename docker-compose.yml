services:
  postgres:
    image: postgres:18-alpine
    container_name: smartrestaurantqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartrestaurantqr
      POSTGRES_USER: smartrestaurant_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Argentina/Buenos_Aires
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database:/database:ro
      - ./backend/database/docker-init.sh:/docker-entrypoint-initdb.d/01-schema.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartrestaurant_app -d smartrestaurantqr"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartrestaurantqr-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smartrestaurantqr
      DB_USER: smartrestaurant_app
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./backend/uploads:/app/uploads
      - "./backend/imagen producto:/app/imagen producto"
      - ./backend/logs:/app/logs

volumes:
  postgres_data:
