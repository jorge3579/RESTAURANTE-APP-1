name: Frontend Cliente CI

on:

  push:

    branches:
      - main

jobs:

  cliente:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: frontend-cliente

    steps:

      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: pnpm

          cache-dependency-path: frontend-cliente/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar compilación del bundle
        run: pnpm run export:android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          CI: "true"
