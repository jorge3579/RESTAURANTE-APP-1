name: Frontend Restaurante CI

on:

  push:

    branches:

      - main

jobs:

  restaurante:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: frontend-restaurante

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

        with:

          node-version: 22

      - run: npm install

      - run: npm run start -- --non-interactive