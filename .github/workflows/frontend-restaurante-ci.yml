name: Frontend Restaurante CI

on:

  push:

    branches:

      - main

jobs:

  restaurante:

    runs-on: ubuntu-latest

    defaults:

      run:

        working-directory: frontend-restaurante

    steps:

      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - uses: actions/setup-node@v4

        with:

          node-version: 22

          cache: pnpm

          cache-dependency-path: frontend-restaurante/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar compilación del bundle
        run: pnpm run export:android
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_SOCKET_URL: ${{ vars.EXPO_PUBLIC_SOCKET_URL }}
          CI: "true"
