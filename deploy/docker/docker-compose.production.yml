version: "3.9"

services:

  backend:

    build: ../../backend

    restart: always

    container_name: smartrestaurant-backend

    ports:

      - "3000:3000"

    env_file:

      - ../../backend/.env

    volumes:

      - ../../backend/uploads:/app/uploads

      - ../../backend/logs:/app/logs

  nginx:

    image: nginx:latest

    restart: always

    ports:

      - "80:80"

    volumes:

      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:

      - backend